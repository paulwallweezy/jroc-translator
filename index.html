<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J-Roc Translator</title>
<style>
  :root { --accent: #4f46e5; --text: #111827; --muted: #6b7280; --line: #e5e7eb; --bg: #ffffff; --soft: #f9fafb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; color: var(--text); background: var(--bg); }
  main { max-width: 640px; margin: 0 auto; padding: 72px 24px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; }
  p.sub { color: var(--muted); margin: 0 0 40px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
  textarea { width: 100%; min-height: 120px; padding: 14px 16px; font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 12px; resize: vertical; outline: none; transition: border-color .15s, box-shadow .15s; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 40px; }
  button { font: inherit; font-size: 14px; font-weight: 500; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; transition: background .15s, border-color .15s, opacity .15s; }
  button:hover:not(:disabled) { background: var(--soft); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { opacity: .9; background: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.speaking { border-color: var(--accent); color: var(--accent); }
  .output { min-height: 64px; padding: 16px; border-radius: 12px; background: var(--soft); font-size: 18px; white-space: pre-wrap; }
  .output.empty { color: var(--muted); font-size: 16px; }
  .alts { list-style: none; padding: 0; margin: 16px 0 0; }
  .alts li { padding: 10px 0; border-top: 1px solid var(--line); color: var(--muted); cursor: pointer; }
  .alts li:hover { color: var(--text); }
  .alts li.active { color: var(--accent); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  footer { margin-top: 56px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>J-Roc Translator</h1>
  <p class="sub">Plain English in, J-Roc out. Know'm sayin'?</p>

  <label for="input">Your text</label>
  <textarea id="input" placeholder="Type something in plain English…">You need to sit safely</textarea>
  <div class="row">
    <button id="translate" class="primary">Translate</button>
    <button id="another">Another version</button>
  </div>

  <label>J-Roc version</label>
  <div id="output" class="output empty">J-Roc's version will show up here.</div>
  <div class="actions">
    <button id="speak" aria-pressed="false">Read it out loud</button>
    <button id="copy">Copy</button>
  </div>
  <ul id="alts" class="alts"></ul>

  <footer>Fan-made parody. Not affiliated with Trailer Park Boys.</footer>
</main>

<script>
/* J-Roc Translator engine — fan-made parody. Dictionary + seeded randomness so each
   version is different but reproducible for the same (text, seed). */
(function (root) {
  const PHRASES = {
    "you need to": ["ya gotta", "ya gots to", "you needa"],
    "need to": ["gotta", "needa", "gots to"],
    "have to": ["gotta", "hafta", "gots to"],
    "want to": ["wanna", "tryna", "wanna"],
    "going to be": ["gonna be", "finna be", "gonna be"],
    "trying to": ["tryna", "tryin' to", "tryna"],
    "kind of": ["kinda", "lowkey"],
    "a lot": ["mad", "hella", "a whole lotta"],
    "very good": ["mad dope", "off the hook", "straight fire"],
    "thank you very much": ["mad props", "big ups, dawg", "respect, homie"],
    "thank you": ["props", "big ups", "respect"],
    "thanks": ["props", "big ups"],
    "i don't know": ["J-Roc don't know", "dunno, dawg", "no clue, yo"],
    "i do not know": ["J-Roc don't know", "dunno, dawg", "no clue, yo"],
    "how are you": ["wassup", "how ya livin'", "what's good"],
    "be careful": ["watch yo'self", "keep it careful, dawg", "stay on da careful tip"],
    "of course": ["fo' sho", "for real", "no doubt"],
    "calm down": ["chill", "cool ya jets", "take it easy, dawg"],
    "sit down": ["post up", "take a seat, homie", "chill on down"],
    "right now": ["right now", "like, right now", "straight away"],
    "i am": ["I'm"], "do not": ["don't"], "cannot": ["can't"], "is not": ["ain't"], "are not": ["ain't"], "am not": ["ain't"],
    "isn't": ["ain't"], "aren't": ["ain't"]
  };
  const WORDS = {
    you: ["ya", "you", "ya"],
    your: ["ya", "yo'", "your"],
    need: ["need", "be needin'", "gotta get"],
    sit: ["chill", "post up", "sit tight"],
    safely: ["safe-like", "on da safe tip", "nice an' safe"],
    safe: ["safe", "solid"],
    friend: ["dawg", "homie"], friends: ["dawgs", "homies"],
    buddy: ["dawg", "homie"], man: ["dawg", "homie"], guys: ["dawgs", "homies"],
    yes: ["word", "true dat"], yeah: ["word", "true dat"], okay: ["aight", "word"], ok: ["aight", "word"],
    no: ["nah", "nah, dawg"],
    money: ["cheddar", "cash money"], cash: ["cheddar", "cash money"], dollars: ["bones", "cheddar"],
    police: ["po-po"], cops: ["po-po"], cop: ["po-po"], officer: ["po-po"],
    good: ["dope", "off the hook"], cool: ["dope", "off the hook"], great: ["off the hook", "mad dope"],
    excellent: ["off the hook", "straight dope"], awesome: ["off the hook", "dope"], nice: ["dope", "fly"],
    bad: ["whack", "busted"], stupid: ["whack", "wack"],
    hello: ["yo", "wassup"], hi: ["yo", "wassup"], goodbye: ["peace out", "later, dawg"], bye: ["peace", "later"],
    really: ["straight up", "fo' real"], very: ["mad", "hella"],
    car: ["whip", "ride"], house: ["crib"], home: ["da crib", "my crib"], trailer: ["crib"],
    food: ["grub", "eats"], eat: ["grub", "chow down"],
    understand: ["feel", "get"], business: ["bizness"], music: ["beats", "music"], song: ["track", "joint"],
    leave: ["bounce", "dip"], go: ["roll", "head"], girlfriend: ["shorty", "girl"],
    because: ["'cause", "cuz"], about: ["'bout"], them: ["'em"], for: ["for", "fo'"],
    something: ["somethin'"], nothing: ["nothin'", "nada"], please: ["c'mon", "please"],
    with: ["wit'", "with"], what: ["what", "whut"], this: ["dis", "this"], that: ["dat", "that"]
  };
  const OPENERS = ["Yo,", "Aight check it,", "Yo yo,", "Listen up,", "Check it,"];
  const CLOSERS = [", know'm sayin'?", ", word up.", ", straight up, dawg.", ". J-Roc out.", ", feel me?", ", fo' real."];
  const ASIDES = ["cuz J-Roc's an entrepreneur, dawg", "that's how J-Roc rolls", "J-Roc keeps it real",
                  "J-Roc's got skills, yo", "word to J-Roc's crew"];
  const ING_SKIP = new Set(["thing", "things", "king", "ring", "sing", "wing", "bring", "string", "spring", "nothing", "something", "anything", "everything", "morning", "evening", "ceiling", "during"]);

  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rngFrom(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  function matchCase(src, out) {
    if (src.length > 1 && src === src.toUpperCase() && /[A-Z]/.test(src) && src !== "I") return out.toUpperCase();
    if (/^[A-Z]/.test(src)) return out[0].toUpperCase() + out.slice(1);
    return out;
  }
  const phraseKeys = Object.keys(PHRASES).sort((a, b) => b.split(" ").length - a.split(" ").length || b.length - a.length);

  function swapWords(text, r, seed) {
    const choose = (key, arr) => arr[(seed + hash(key)) % arr.length];
    const thirdPerson = r() < 0.5;           // sometimes J-Roc talks about himself
    const tokens = text.match(/[A-Za-z']+|[^A-Za-z']+/g) || [];
    const out = [];
    for (let i = 0; i < tokens.length;) {
      const t = tokens[i], low = t.toLowerCase();
      if (!/^[A-Za-z']+$/.test(t)) { out.push(t); i++; continue; }
      if (thirdPerson) {
        // "I am" -> "J-Roc is"
        if (low === "i" && tokens[i + 2] && tokens[i + 2].toLowerCase() === "am" && /^\s+$/.test(tokens[i + 1])) { out.push("J-Roc is"); i += 3; continue; }
        const tp = { "i": "J-Roc", "me": "J-Roc", "my": "J-Roc's", "i'm": "J-Roc's", "mine": "J-Roc's", "myself": "J-Roc" }[low];
        if (tp) { out.push(tp); i++; continue; }
      }
      let done = false;
      for (const key of phraseKeys) {
        const parts = key.split(" ");
        let j = i, k = 0, ok = true;
        while (k < parts.length) {
          if (j >= tokens.length || tokens[j].toLowerCase() !== parts[k]) { ok = false; break; }
          k++; j++;
          if (k < parts.length) { if (j >= tokens.length || !/^\s+$/.test(tokens[j])) { ok = false; break; } j++; }
        }
        if (ok) { out.push(matchCase(t, choose(key, PHRASES[key]))); i = j; done = true; break; }
      }
      if (done) continue;
      let w = t;
      if (WORDS[low]) w = matchCase(t, choose(low, WORDS[low]));
      else if (low === "the" && r() < 0.6) w = matchCase(t, "da");
      else if (low.endsWith("ing") && low.length >= 5 && !ING_SKIP.has(low)) w = t.slice(0, -1) + "'";
      out.push(w);
      i++;
    }
    return out.join("");
  }

  function translate(text, seed) {
    const src = (text || "").trim();
    if (!src) return "";
    const r = rngFrom(hash(src) ^ Math.imul((seed || 0) + 1, 2654435761));
    let body = swapWords(src, r, seed || 0).replace(/\s+/g, " ").trim();

    // Optional aside after the first sentence (multi-sentence) or before the closer.
    const isQuestion = /\?\s*$/.test(src);
    const addAside = !isQuestion && r() < 0.35;
    let endPunct = (body.match(/[.!?]+$/) || [""])[0];
    body = body.slice(0, body.length - endPunct.length);

    // Opener (most of the time). Lowercase the next word unless it's "I"/"J-Roc".
    if (r() < 0.75 && !/^(yo|wassup)\b/i.test(body)) {
      const first = body.match(/^[A-Za-z'-]+/);
      if (first && !/^(I|I'm|J-Roc.*)$/.test(first[0]) && !(first[0].length > 1 && first[0] === first[0].toUpperCase()))
        body = first[0][0].toLowerCase() + body.slice(1);
      body = pick(r, OPENERS) + " " + body;
    }
    if (addAside) body += ", " + pick(r, ASIDES);

    // Closer: always, so it's unmistakably J-Roc. Keep a question a question.
    if (endPunct.includes("?")) body += "?" + (r() < 0.5 ? " Know'm sayin'?" : " Word up.");
    else body += pick(r, CLOSERS);
    return body;
  }

  function variants(text, n, start) {
    n = n || 3; start = start || 0;
    const res = [];
    for (let s = start; res.length < n && s < start + n * 8; s++) {
      const t = translate(text, s);
      if (t && !res.includes(t)) res.push(t);
    }
    return res;
  }

  const api = { translate, variants, PHRASES, WORDS, OPENERS, CLOSERS, ASIDES };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.SlangEngine = api;
})(this);

</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const input = $("input"), output = $("output"), alts = $("alts");
  const speakBtn = $("speak"), copyBtn = $("copy");
  let options = [], current = 0, batch = 0;

  function render() {
    const has = options.length > 0;
    output.textContent = has ? options[current] : "J-Roc's version will show up here.";
    output.classList.toggle("empty", !has);
    alts.innerHTML = "";
    options.forEach((t, i) => {
      const li = document.createElement("li");
      li.textContent = t;
      li.className = i === current ? "active" : "";
      li.onclick = () => { current = i; stopSpeaking(); render(); };
      alts.appendChild(li);
    });
    if (options.length < 2) alts.innerHTML = "";
    updateSpeakState();
    copyBtn.disabled = !has;
  }

  function run() {
    const text = input.value.trim();
    stopSpeaking();
    batch = 0;
    options = text ? SlangEngine.variants(text, 3) : [];
    current = 0;
    render();
  }

  $("translate").onclick = run;
  $("another").onclick = () => {
    if (!options.length) return run();
    stopSpeaking();
    if (current < options.length - 1) current++;
    else { batch++; options = SlangEngine.variants(input.value.trim(), 3, batch * 3); current = 0; }
    render();
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) run(); });
  copyBtn.onclick = async () => {
    try { await navigator.clipboard.writeText(output.textContent); copyBtn.textContent = "Copied"; }
    catch { copyBtn.textContent = "Copy failed"; }
    setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
  };

  // ---- Read it out loud (Web Speech API) ----
  const synth = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window ? window.speechSynthesis : null;
  let voice = null, speaking = false;

  function pickVoice() {
    if (!synth) return;
    const voices = synth.getVoices().filter((v) => /^en/i.test(v.lang));
    if (!voices.length) return;
    const casual = /\b(male|david|daniel|alex|fred|aaron|guy|mark|tom|james|ryan|eric|christopher|andrew|brian|reed|rocko|ralph)\b/i;
    voice =
      voices.find((v) => casual.test(v.name) && /en[-_]US/i.test(v.lang)) ||
      voices.find((v) => casual.test(v.name)) ||
      voices.find((v) => /en[-_]US/i.test(v.lang)) ||
      voices[0];
  }

  function updateSpeakState() {
    if (!synth) return;
    speakBtn.disabled = options.length === 0;
    speakBtn.title = speakBtn.disabled ? "Translate something first" : (speaking ? "Stop reading" : "Read the translation aloud");
    speakBtn.textContent = speaking ? "Stop" : "Read it out loud";
    speakBtn.classList.toggle("speaking", speaking);
    speakBtn.setAttribute("aria-pressed", String(speaking));
  }

  function stopSpeaking() {
    if (synth && (synth.speaking || synth.pending)) synth.cancel();
    speaking = false;
    updateSpeakState();
  }

  function speak() {
    if (!synth || !options.length) return;
    if (speaking) return stopSpeaking();
    synth.cancel();
    if (!voice) pickVoice();
    const u = new SpeechSynthesisUtterance(options[current]);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-US"; }
    u.rate = 1.15;
    u.pitch = 0.95;
    u.onend = u.onerror = () => { speaking = false; updateSpeakState(); };
    speaking = true;
    updateSpeakState();
    synth.speak(u);
  }

  if (synth) {
    pickVoice();
    if ("onvoiceschanged" in synth) synth.onvoiceschanged = pickVoice;
    speakBtn.onclick = speak;
    window.addEventListener("beforeunload", () => synth.cancel());
  } else {
    speakBtn.disabled = true;
    speakBtn.title = "Read-aloud isn't supported in this browser";
  }

  run();
})();
</script>
</body>
</html>
